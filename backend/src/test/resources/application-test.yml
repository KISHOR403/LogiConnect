# ==============================================================================
# LogiConnect Platform - Test Configuration
# ==============================================================================
spring:
  datasource:
    url: jdbc:h2:mem:logiconnect_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

server:
  servlet:
    context-path: /api/v1

app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    access-expiration-ms: 60000
    refresh-expiration-ms: 600000
    issuer: logiconnect-test
  cors:
    allowed-origins: http://localhost:3000
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: Authorization,Content-Type,Accept
    allow-credentials: true
    max-age: 3600

logging:
  level:
    root: WARN
    com.logiconnect.platform: INFO
