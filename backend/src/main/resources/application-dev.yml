# ==============================================================================
# LogiConnect Platform - Development Configuration
# ==============================================================================
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/logiconnect_db}
    username: ${DATABASE_USERNAME:logiconnect_user}
    password: ${DATABASE_PASSWORD:change_me_in_production}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: LogiConnectDevHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    root: INFO
    com.logiconnect.platform: DEBUG
    org.springframework.security: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE
