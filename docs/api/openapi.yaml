openapi: 3.0.3
info:
  title: LogiConnect Enterprise REST API
  description: |
    Enterprise internal communication and collaboration platform for logistics operations.
    Supports organizational hierarchy, granular RBAC, secure messaging, company broadcasts,
    document management, meeting coordination, and compliance audit logs.
  version: 1.0.0
  contact:
    name: LogiConnect Architecture Team
    email: architecture@logiconnect.internal
servers:
  - url: http://localhost:8080/api/v1
    description: Local Development Server
  - url: https://api.logiconnect.internal/api/v1
    description: Corporate Production Gateway

tags:
  - name: Authentication
    description: Login, token rotation, session management, and password lifecycle
  - name: Users
    description: User security profile and administrative account management
  - name: Employees
    description: HR employee directory, profiles, onboarding, and status transitions
  - name: Departments
    description: Corporate departments and departmental hierarchy
  - name: Teams
    description: Operational units and logistics hub teams
  - name: Roles & Permissions
    description: RBAC role definitions and granular permission assignments
  - name: Conversations
    description: Direct 1-to-1 chats and ad-hoc multi-member group rooms
  - name: Messages
    description: High-volume message streams with cursor-based pagination
  - name: Channels
    description: Organizational channels (Company, Department, Team, Private)
  - name: Announcements
    description: Official broadcasts, priority alerts, acknowledgement tracking, and statistics
  - name: Documents
    description: SOPs, compliance files, and pre-signed object storage upload handshake
  - name: Meetings
    description: Shift syncs, meeting scheduling, and RSVP coordination
  - name: Calendar
    description: Aggregated schedule and milestone feed
  - name: Notifications
    description: User activity alerts, unread counts, and batch updates
  - name: Search
    description: Unified cross-domain search across employees, messages, documents, and notices
  - name: Admin
    description: Executive dashboard metrics and system health probes
  - name: Audit Logs
    description: Append-only immutable compliance and security audit trail

paths:
  # ==========================================================================
  # 1. AUTHENTICATION API
  # ==========================================================================
  /auth/login:
    post:
      tags: [Authentication]
      summary: User Login
      description: Authenticate user credentials and return JWT access and refresh tokens.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Refresh Access Token
      description: Issue a new access token and rotate the refresh token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponseEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /auth/logout:
    post:
      tags: [Authentication]
      summary: Invalidate Session
      description: Revoke refresh token and terminate current session.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Successfully logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponseVoid'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /auth/me:
    get:
      tags: [Authentication]
      summary: Current User Profile
      description: Returns the authenticated user record, employee directory details, roles, and granular permissions.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current user profile retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /auth/change-password:
    post:
      tags: [Authentication]
      summary: Change Password
      description: Change password for currently authenticated user.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponseVoid'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/forgot-password:
    post:
      tags: [Authentication]
      summary: Forgot Password Request
      description: Request a password reset link.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Reset email dispatched if account exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponseVoid'

  /auth/reset-password:
    post:
      tags: [Authentication]
      summary: Reset Password
      description: Reset account password using verified token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password reset completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponseVoid'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'

  # ==========================================================================
  # 2. USERS API
  # ==========================================================================
  /users:
    get:
      tags: [Users]
      summary: List User Accounts
      description: Administrative list of user accounts with status and security flags.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, INACTIVE, LOCKED, PENDING_VERIFICATION]
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: User accounts retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPageEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'

  /users/{id}:
    get:
      tags: [Users]
      summary: Get User Details
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User details retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetailEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/{id}/status:
    patch:
      tags: [Users]
      summary: Update User Status
      description: Activate, deactivate, or unlock a user account.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserStatusRequest'
      responses:
        '200':
          description: User status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetailEnvelope'

  /users/{id}/roles:
    get:
      tags: [Users]
      summary: Get User Roles
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Assigned roles retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleListEnvelope'
    put:
      tags: [Users]
      summary: Assign Roles to User
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignUserRolesRequest'
      responses:
        '200':
          description: Roles updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleListEnvelope'

  # ==========================================================================
  # 3. EMPLOYEES API
  # ==========================================================================
  /employees:
    get:
      tags: [Employees]
      summary: Directory Search & Employee List
      description: Search and filter active employee directory with offset pagination.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
        - name: search
          in: query
          schema:
            type: string
        - name: departmentId
          in: query
          schema:
            type: string
            format: uuid
        - name: teamId
          in: query
          schema:
            type: string
            format: uuid
        - name: location
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, PROBATION, ON_LEAVE, SUSPENDED, TERMINATED, RESIGNED]
        - name: sort
          in: query
          schema:
            type: string
            example: "lastName,asc"
      responses:
        '200':
          description: Employee directory page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeePageEnvelope'
    post:
      tags: [Employees]
      summary: Onboard New Employee
      description: Register a new employee profile in corporate directory (HR_ADMIN / SUPER_ADMIN).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEmployeeRequest'
      responses:
        '201':
          description: Employee created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeDetailEnvelope'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /employees/{employeeId}:
    get:
      tags: [Employees]
      summary: Get Employee Profile
      security:
        - BearerAuth: []
      parameters:
        - name: employeeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Employee profile details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeDetailEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Employees]
      summary: Update Employee Profile
      security:
        - BearerAuth: []
      parameters:
        - name: employeeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEmployeeRequest'
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeDetailEnvelope'

  /employees/{employeeId}/status:
    patch:
      tags: [Employees]
      summary: Transition Employee Status (Offboarding/Leave)
      security:
        - BearerAuth: []
      parameters:
        - name: employeeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEmployeeStatusRequest'
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeDetailEnvelope'

  # ==========================================================================
  # 4. DEPARTMENTS API
  # ==========================================================================
  /departments:
    get:
      tags: [Departments]
      summary: List Departments
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
      responses:
        '200':
          description: List of departments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentPageEnvelope'
    post:
      tags: [Departments]
      summary: Create Department
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDepartmentRequest'
      responses:
        '201':
          description: Department created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentDetailEnvelope'

  /departments/{id}:
    get:
      tags: [Departments]
      summary: Get Department Details
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Department details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentDetailEnvelope'
    patch:
      tags: [Departments]
      summary: Update Department
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDepartmentRequest'
      responses:
        '200':
          description: Department updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentDetailEnvelope'

  /departments/{id}/employees:
    get:
      tags: [Departments]
      summary: List Department Employees
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
      responses:
        '200':
          description: Employees in department
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeePageEnvelope'

  # ==========================================================================
  # 5. TEAMS API
  # ==========================================================================
  /teams:
    get:
      tags: [Teams]
      summary: List Teams
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
        - name: departmentId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of teams
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamPageEnvelope'
    post:
      tags: [Teams]
      summary: Create Team
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTeamRequest'
      responses:
        '201':
          description: Team created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamDetailEnvelope'

  /teams/{id}:
    get:
      tags: [Teams]
      summary: Get Team Details
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Team details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamDetailEnvelope'
    patch:
      tags: [Teams]
      summary: Update Team
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTeamRequest'
      responses:
        '200':
          description: Team updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamDetailEnvelope'

  /teams/{id}/employees:
    get:
      tags: [Teams]
      summary: List Team Employees
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
      responses:
        '200':
          description: Employees in team
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeePageEnvelope'

  # ==========================================================================
  # 6. CONVERSATIONS API
  # ==========================================================================
  /conversations:
    get:
      tags: [Conversations]
      summary: List User Conversations
      description: Retrieve user inbox of direct and group chats sorted by last message.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
        - name: type
          in: query
          schema:
            type: string
            enum: [DIRECT, GROUP]
      responses:
        '200':
          description: Conversations retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationPageEnvelope'

  /conversations/{id}:
    get:
      tags: [Conversations]
      summary: Get Conversation Details
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Conversation details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationDetailEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'

  /conversations/direct:
    post:
      tags: [Conversations]
      summary: Create or Retrieve Direct Chat
      description: Deduplicated direct chat initialization with another user.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDirectConversationRequest'
      responses:
        '200':
          description: Existing conversation returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationDetailEnvelope'
        '201':
          description: New direct conversation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationDetailEnvelope'

  /conversations/group:
    post:
      tags: [Conversations]
      summary: Create Group Chat
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGroupConversationRequest'
      responses:
        '201':
          description: Group conversation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationDetailEnvelope'

  /conversations/{id}/members:
    get:
      tags: [Conversations]
      summary: List Conversation Members
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Members list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationMemberListEnvelope'
    post:
      tags: [Conversations]
      summary: Add Members to Group Conversation
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddConversationMembersRequest'
      responses:
        '200':
          description: Members added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationMemberListEnvelope'

  /conversations/{id}/members/{userId}:
    delete:
      tags: [Conversations]
      summary: Remove Member / Leave Conversation
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Member removed successfully

  # ==========================================================================
  # 7. MESSAGES API
  # ==========================================================================
  /conversations/{id}/messages:
    get:
      tags: [Messages]
      summary: Get Conversation Message Stream (Cursor Paginated)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CursorQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/DirectionQuery'
      responses:
        '200':
          description: Message stream
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageCursorEnvelope'
    post:
      tags: [Messages]
      summary: Send Message in Conversation
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '201':
          description: Message posted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageDetailEnvelope'

  /channels/{id}/messages:
    get:
      tags: [Messages]
      summary: Get Channel Message Stream (Cursor Paginated)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CursorQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/DirectionQuery'
      responses:
        '200':
          description: Channel message stream
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageCursorEnvelope'
    post:
      tags: [Messages]
      summary: Send Message in Channel
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '201':
          description: Message posted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageDetailEnvelope'

  /channels/{channelId}/messages/{messageId}/pin:
    post:
      tags: [Messages]
      summary: Pin Message in Channel
      description: Pins a message to the top of the channel header (Admin/Moderator only).
      security:
        - BearerAuth: []
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: messageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Message pinned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageDetailEnvelope'
    delete:
      tags: [Messages]
      summary: Unpin Message in Channel
      description: Unpins a message from the channel header (Admin/Moderator only).
      security:
        - BearerAuth: []
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: messageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Message unpinned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageDetailEnvelope'

  /messages/{id}:
    patch:
      tags: [Messages]
      summary: Edit Message Text
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditMessageRequest'
      responses:
        '200':
          description: Message edited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageDetailEnvelope'
    delete:
      tags: [Messages]
      summary: Soft Delete Message
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Message soft deleted

  # ==========================================================================
  # 8. CHANNELS API
  # ==========================================================================
  /channels:
