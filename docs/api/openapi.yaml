# ============================================================================
# COMPONENTS & SCHEMAS
# ============================================================================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PageQuery:
      name: page
      in: query
      description: 0-indexed page number
      schema:
        type: integer
        default: 0
    SizeQuery:
      name: size
      in: query
      description: Items per page (max 100)
      schema:
        type: integer
        default: 20
        maximum: 100
    CursorQuery:
      name: cursor
      in: query
      description: Base64-encoded time pointer
      schema:
        type: string
    LimitQuery:
      name: limit
      in: query
      description: Stream fetch limit
      schema:
        type: integer
        default: 50
        maximum: 100
    DirectionQuery:
      name: direction
      in: query
      description: Cursor stream direction
      schema:
        type: string
        enum: [BEFORE, AFTER]
        default: BEFORE

  responses:
    BadRequest:
      description: Bad Request / Malformed Syntax
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthenticated:
      description: Authentication Missing or Expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Insufficient Role / Unauthorized Resource Access
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Target Resource Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Resource Conflict (Unique Key Violation)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Semantic Payload Validation Failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

