          nullable: true
        message:
          type: string
          example: "Operation successful"

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: "VALIDATION_FAILED"
            message:
              type: string
              example: "Provided payload violates validation constraints"
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  rejectedValue:
                    type: string
                  issue:
                    type: string
        timestamp:
          type: string
          format: date-time
          example: "2026-08-31T12:00:00Z"
        path:
          type: string
          example: "/api/v1/employees"

